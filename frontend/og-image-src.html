<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 30% 30%, #141a2b 0%, #0a0d14 60%, #05070c 100%);
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .rings { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 900px; height: 900px; }
  .ring { position: absolute; border: 1.5px solid rgba(52,211,153,0.18); border-radius: 50%; top: 50%; left: 50%; }
  .r1 { width: 900px; height: 900px; margin: -450px 0 0 -450px; }
  .r2 { width: 640px; height: 640px; margin: -320px 0 0 -320px; }
  .r3 { width: 380px; height: 380px; margin: -190px 0 0 -190px; }
  .cross { position: absolute; background: rgba(52,211,153,0.14); }
  .cross.v { width: 1.5px; height: 900px; left: 50%; top: 50%; margin: -450px 0 0 0; }
  .cross.h { height: 1.5px; width: 900px; top: 50%; left: 50%; margin: 0 0 0 -450px; }

  .content { position: relative; z-index: 2; display: flex; align-items: center; gap: 56px; }
  .badge {
    width: 180px; height: 180px; border-radius: 40px;
    background: linear-gradient(135deg, #141a2b, #0a0d14);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(52,211,153,0.15);
  }
  .badge svg { width: 130px; height: 130px; }

  .text-block { display: flex; flex-direction: column; }
  .eyebrow {
    font-size: 22px; font-weight: 700; letter-spacing: 4px;
    color: #34d399; margin-bottom: 14px;
  }
  .title { font-size: 66px; font-weight: 900; color: #ffffff; letter-spacing: -1px; line-height: 1.1; }
  .subtitle { font-size: 26px; font-weight: 500; color: #94a3b8; margin-top: 18px; }
  .chips { display: flex; gap: 12px; margin-top: 28px; }
  .chip {
    font-size: 18px; font-weight: 700; color: #7dd3fc;
    background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.35);
    padding: 8px 18px; border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="rings">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="cross v"></div>
    <div class="cross h"></div>
  </div>

  <div class="content">
    <div class="badge">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <defs>
          <radialGradient id="sweep" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path d="M32 32 L32 6 A26 26 0 0 1 55.5 20 Z" fill="url(#sweep)"/>
        <circle cx="32" cy="32" r="24" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.6"/>
        <circle cx="32" cy="32" r="15" fill="none" stroke="#34d399" stroke-opacity="0.45" stroke-width="1.6"/>
        <line x1="32" y1="8" x2="32" y2="56" stroke="#34d399" stroke-opacity="0.25" stroke-width="1.2"/>
        <line x1="8" y1="32" x2="56" y2="32" stroke="#34d399" stroke-opacity="0.25" stroke-width="1.2"/>
        <polyline points="14,38 24,32 30,36 44,18 50,22" fill="none" stroke="#7dd3fc" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="50" cy="22" r="4" fill="#38bdf8"/>
        <circle cx="32" cy="32" r="3.4" fill="#34d399"/>
      </svg>
    </div>

    <div class="text-block">
      <div class="eyebrow">QUANTITATIVE MARKET RADAR</div>
      <div class="title">퀀트 마켓 레이더</div>
      <div class="subtitle">코스피·코스닥 실시간 퀀트 스캐너 &amp; 재무 발굴기</div>
      <div class="chips">
        <span class="chip">256 기법</span>
        <span class="chip">4대 재무 퀀트</span>
        <span class="chip">VKOSPI</span>
      </div>
    </div>
  </div>
</body>
</html>
